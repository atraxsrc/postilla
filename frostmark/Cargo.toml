[package]
name = "frostmark"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "HTML/Markdown renderer for libcosmic"

[dependencies]
libcosmic.workspace = true
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"
bitflags = "2.13.1"

comrak = { version = "0.55.0", default-features = false, optional = true }
widgets = { path = "../widgets" }

typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }

merman = { version = "0.8.0-alpha.7", default-features = false, features = ["png", "all-diagrams"]}
image.workspace = true
typst-pdf = "0.15.1"

[dev-dependencies]
tokio.workspace = true
reqwest.workspace = true
open.workspace = true

[features]
default = ["markdown", "libcosmic-wgpu", "libcosmic-tokio", "libcosmic-windowing"]
markdown = ["dep:comrak"]
libcosmic-wgpu = ["libcosmic/wgpu"]
libcosmic-tokio = ["libcosmic/tokio"]
libcosmic-windowing = ["libcosmic/x11", "libcosmic/wayland"]
